[book]
authors = ["Jho00"]
language = "en"
multilingual = false
src = "src"
title = "system-engineering-playbook"

[build]
build-dir = "book"
create-missing = true

# Draw.io preprocessor - будет собран в GitHub Actions
# Для локальной разработки: cd _tools/mdbook-drawio && cargo build --release && cp target/release/mdbook-drawio /usr/local/bin/
[preprocessor.drawio]
command = "mdbook-drawio"
# Если preprocessor не найден, закомментируйте эту секцию для локальной сборки

# Mermaid preprocessor - будет установлен в GitHub Actions
# Для локальной разработки: cargo install mdbook-mermaid
[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
additional-css = ["_assets/custom.css"]
additional-js = []

[output.html.playground]
editable = false