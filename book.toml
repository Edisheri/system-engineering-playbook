[book]
authors = ["Jho00"]
language = "en"
multilingual = false
src = "src"
title = "system-engineering-playbook"

[build]
build-dir = "book"
create-missing = true

# Draw.io preprocessor - будет собран в GitHub Actions
# Для локальной разработки: cd _tools/mdbook-drawio && cargo build --release && cp target/release/mdbook-drawio /usr/local/bin/
# ВНИМАНИЕ: Если preprocessor не найден, mdbook build может упасть. 
# В GitHub Actions preprocessor будет собран автоматически.
# Draw.io preprocessor - будет собран в GitHub Actions
[preprocessor.drawio]
command = "mdbook-drawio"

# Mermaid preprocessor - будет установлен в GitHub Actions
[preprocessor.mermaid]
command = "mdbook-mermaid"

# PlantUML preprocessor - будет установлен в GitHub Actions
# mdbook-plantuml автоматически найдет plantuml в PATH
[preprocessor.plantuml]
command = "mdbook-plantuml"
# Опционально: можно указать путь к plantuml явно
# [preprocessor.plantuml.command]
# plantuml = "/usr/bin/plantuml"

[output.html]
# CSS для увеличения размера Draw.io диаграмм (опционально)
# Если нужны большие диаграммы, раскомментируйте строку ниже после исправления пути
# additional-css = ["_assets/custom.css"]
additional-js = []

[output.html.playground]
editable = false