[book]
authors = ["Jho00"]
language = "en"
multilingual = false
src = "src"
title = "system-engineering-playbook"

[build]
build-dir = "book"
create-missing = true

# Draw.io preprocessor - будет собран в GitHub Actions
# Для локальной разработки: cd _tools/mdbook-drawio && cargo build --release && cp target/release/mdbook-drawio /usr/local/bin/
# ВНИМАНИЕ: Если preprocessor не найден, mdbook build может упасть. 
# В GitHub Actions preprocessor будет собран автоматически.
# Draw.io preprocessor - будет собран в GitHub Actions
[preprocessor.drawio]
command = "mdbook-drawio"

# Mermaid preprocessor - будет установлен в GitHub Actions
[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
# CSS файл должен быть в src/_assets/custom.css
# Путь указывается относительно src/ директории
# ВНИМАНИЕ: Для локальной сборки без preprocessors закомментируйте строку ниже
additional-css = ["_assets/custom.css"]
additional-js = []

[output.html.playground]
editable = false